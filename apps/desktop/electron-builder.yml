appId: ai.closedloop.desktop
productName: ClosedLoop

files:
  - dist/**/*
  - src/renderer/index.html
  - package.json

extraResources:
  - from: resources/icon-1024.png
    to: icon-1024.png
  - from: resources/trayIconTemplate.png
    to: trayIconTemplate.png
  - from: resources/trayIconTemplate@2x.png
    to: trayIconTemplate@2x.png

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: ${APPLE_TEAM_ID}

publish:
  provider: github
  owner: closedloop-ai
  repo: closedloop-electron

directories:
  output: dist-dmg
