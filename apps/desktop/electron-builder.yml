appId: ai.closedloop.desktop
productName: ClosedLoop

files:
  - app/**/*
  - package.json

beforeBuild: ./scripts/use-staged-node-modules.mjs

extraResources:
  - from: resources/icon-1024.png
    to: icon-1024.png
  - from: resources/trayIconTemplate.png
    to: trayIconTemplate.png
  - from: resources/trayIconTemplate@2x.png
    to: trayIconTemplate@2x.png
  # Generated Claude-Code-Agent-Monitor runtime tree, shipped unpacked
  # (outside the asar) so the spawned Node server, the built client, and the
  # hook scripts resolve as real files. Built by scripts/build-agent-monitor.mjs
  # before packaging (chained into `build`). `client/dist/**/*` (NOT
  # `client/**/*`) — the server resolves ../client/dist relative to server/, so
  # the server/ <-> client/dist/ layout must be preserved.
  - from: .generated/agent-monitor
    to: agent-monitor
    filter:
      - server/**/*
      - client/dist/**/*
      - scripts/**/*
      - package.json
      - LICENSE

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: closedloop-ai
  repo: closedloop-electron

directories:
  output: dist-dmg
