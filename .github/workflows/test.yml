name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # @closedloop-ai/design-system is published to GitHub Packages from another
      # org repo, so this repo's GITHUB_TOKEN gets a 403 fetching it. Mint an
      # org-scoped GitHub App token (the same app compatibility-smoke uses for
      # cross-repo access) with packages:read so pnpm install can pull it.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLOSEDLOOP_APP_ID_STAGE }}
          private-key: ${{ secrets.CLOSEDLOOP_APP_SECRET_STAGE }}
          owner: ${{ github.repository_owner }}
          permission-packages: read

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate build info
        run: pnpm -r prebuild

      - name: Lint
        run: pnpm -C apps/desktop lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
