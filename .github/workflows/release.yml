name: Release Desktop

on:
  workflow_dispatch:

concurrency:
  group: release-desktop
  cancel-in-progress: false

env:
  SKIP: "false"

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check_release.outputs.skip }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already released
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Version $VERSION already released — skipping build. Bump the version in apps/desktop/package.json to trigger a new release."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build_macos:
    needs: prepare_release
    if: needs.prepare_release.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build info
        run: pnpm -r prebuild

      - name: Lint
        run: pnpm -C apps/desktop lint

      - name: Typecheck
        run: pnpm -C apps/desktop typecheck

      - name: Run tests
        run: pnpm -C apps/desktop test

      - name: Build and publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm -C apps/desktop release

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClosedLoop-macOS-${{ needs.prepare_release.outputs.version }}
          path: apps/desktop/dist-dmg/*.dmg
          if-no-files-found: error

  build_windows:
    needs: prepare_release
    if: needs.prepare_release.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build info
        run: pnpm -r prebuild

      - name: Build and publish Windows installers to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm -C apps/desktop clean:package
          pnpm -C apps/desktop build
          pnpm -C apps/desktop stage:package
          node apps/desktop/scripts/run-electron-builder.mjs --win --publish always

      - name: Upload Windows installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClosedLoop-Windows-${{ needs.prepare_release.outputs.version }}
          path: |
            apps/desktop/dist-dmg/*.exe
            apps/desktop/dist-dmg/*.blockmap
          if-no-files-found: error

  finalize_release:
    needs:
      - prepare_release
      - build_macos
      - build_windows
    if: needs.prepare_release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish release (undraft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare_release.outputs.version }}" --draft=false --repo "${{ github.repository }}"

      - name: Build Slack message
        id: slack_message
        run: |
          VERSION="${{ needs.prepare_release.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          MSG=$(printf "ClosedLoop Gateway build ready\nVersion: %s\nRelease: %s" \
            "$VERSION" "$RELEASE_URL")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Slack
        continue-on-error: true
        uses: ./.github/actions/slack-notify
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_REPO_WEBHOOK_URL }}
          message: ${{ steps.slack_message.outputs.message }}
