<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal</title>
  <script>
    // Extract auth token and clear it from the URL + global BEFORE any
    // external scripts load. The token is stashed in a closure-local variable
    // via a custom event so CDN scripts never see it on window.
    (function () {
      var p = new URLSearchParams(window.location.search);
      var params = {
        loopId: p.get("loopId") || "",
        port: p.get("port") || "19432",
        command: p.get("command") || "",
        token: p.get("token") || "",
      };
      if (p.has("token")) {
        p.delete("token");
        history.replaceState(null, "", window.location.pathname + "?" + p.toString());
      }
      // Pass params to the app script via a custom event — never on window.
      document.addEventListener("__termReady", function handler() {
        document.removeEventListener("__termReady", handler);
        document.dispatchEvent(new CustomEvent("__termParams", { detail: params }));
      });
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: "Menlo", "Monaco", "Consolas", monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #181825;
      border-bottom: 1px solid #313244;
      font-size: 12px;
      flex-shrink: 0;
    }
    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f9e2af;
    }
    #status-dot.connected { background: #a6e3a1; }
    #status-dot.disconnected { background: #f38ba8; }
    #status-text { opacity: 0.8; }
    #command-label {
      margin-left: auto;
      opacity: 0.5;
      font-size: 11px;
    }
    #terminal-container {
      flex: 1;
      padding: 4px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="status-dot"></span>
    <span id="status-text">Connecting...</span>
    <span id="command-label"></span>
  </div>
  <div id="terminal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
    integrity="sha384-KdckZE7oJC74TOSa/eWjgvB8PLc34srqU20NA7YAsHK2p6yHCdA3j1NX7VybMeom"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
    integrity="sha384-V3EjAdUixveFAPRccYczsGDpHEa+Wv7StB8in/bhbPKDhmwS3Uuy1APrbM2tTIbQ"
    crossorigin="anonymous"></script>
  <script>
    (function () {
      // Request params from the first inline script via custom event — the
      // token was never exposed on window, so CDN scripts cannot read it.
      let loopId = "", port = "19432", command = "", authToken = "";
      document.addEventListener("__termParams", function handler(e) {
        document.removeEventListener("__termParams", handler);
        loopId = e.detail.loopId;
        port = e.detail.port;
        command = e.detail.command;
        authToken = e.detail.token;
      });
      document.dispatchEvent(new Event("__termReady"));

      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const commandLabel = document.getElementById("command-label");
      commandLabel.textContent = command ? `${command} ${loopId.slice(0, 8)}` : loopId.slice(0, 8);

      // Initialize xterm
      const term = new Terminal({
        fontFamily: '"Menlo", "Monaco", "Consolas", monospace',
        fontSize: 13,
        theme: {
          background: "#1e1e2e",
          foreground: "#cdd6f4",
          cursor: "#f5e0dc",
          selectionBackground: "#585b7066",
          black: "#45475a",
          red: "#f38ba8",
          green: "#a6e3a1",
          yellow: "#f9e2af",
          blue: "#89b4fa",
          magenta: "#f5c2e7",
          cyan: "#94e2d5",
          white: "#bac2de",
          brightBlack: "#585b70",
          brightRed: "#f38ba8",
          brightGreen: "#a6e3a1",
          brightYellow: "#f9e2af",
          brightBlue: "#89b4fa",
          brightMagenta: "#f5c2e7",
          brightCyan: "#94e2d5",
          brightWhite: "#a6adc8",
        },
        cursorBlink: true,
        scrollback: 10000,
      });

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById("terminal-container"));
      fitAddon.fit();

      // Resize handling
      const resizeObserver = new ResizeObserver(() => {
        fitAddon.fit();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      });
      resizeObserver.observe(document.getElementById("terminal-container"));

      function setStatus(state, text) {
        statusDot.className = state;
        statusText.textContent = text;
      }

      // WebSocket connection — pass auth token as query param (browser WebSocket
      // API does not support custom headers; the upgrade handler reads it).
      const wsParams = authToken ? `?token=${encodeURIComponent(authToken)}` : "";
      const wsUrl = `ws://127.0.0.1:${port}/api/engineer/jobs/${loopId}/terminal${wsParams}`;
      let ws = null;

      function connect() {
        setStatus("", "Connecting...");
        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
          setStatus("connected", "Connected");
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        };

        ws.onmessage = function (event) {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "replay" || msg.type === "data") {
              term.write(msg.data);
            } else if (msg.type === "exit") {
              setStatus("disconnected", `Process exited (code ${msg.exitCode})`);
              // Close the terminal window shortly after the process exits
              setTimeout(function () { window.close(); }, 2000);
            } else if (msg.type === "error") {
              setStatus("disconnected", msg.message || "Error");
            }
          } catch {
            // Ignore parse errors
          }
        };

        ws.onclose = function () {
          setStatus("disconnected", "Disconnected");
        };

        ws.onerror = function () {
          setStatus("disconnected", "Connection error");
        };
      }

      // Forward keyboard input to PTY
      term.onData(function (data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input", data: data }));
        }
      });

      connect();
    })();
  </script>
</body>
</html>
