packages:
  - apps/*

# Supply-chain hardening (Shai-Hulud / TanStack-style npm worm mitigations).
# minimumReleaseAge: refuse to install package versions younger than 7 days
# (10080 minutes), giving the registry time to detect and yank compromised
# releases before they land in our lockfile.
minimumReleaseAge: 10080
# Our own internal packages ship frequently and are trusted — exempt from the
# 7-day quarantine so we can consume new versions immediately.
minimumReleaseAgeExclude:
  - "@closedloop-ai/loops-api"
  # External, but exempted deliberately (PRD-414 / FEA-1431). We pin
  # @pydantic/genai-prices to an EXACT version (no semver range) so this
  # exemption cannot silently pull a newer, unvetted release — bumping it is
  # an explicit code change reviewed against the changelog. Audited 2026-05-29:
  # maintained by the Pydantic core team, no pre/post-install scripts, sole
  # runtime sub-dependency is yargs. Needed because the current correct-pricing
  # release (0.0.62) is younger than the 7-day quarantine window.
  - "@pydantic/genai-prices"
# blockExoticSubdeps: refuse non-registry specifiers (git:, github:, http(s):,
# file:, link:) introduced via transitive deps — closes the github-ref bypass.
blockExoticSubdeps: true

# pnpm 10 disables postinstall lifecycle scripts by default — also a
# supply-chain mitigation, since malicious packages typically run their
# payload via postinstall. Explicitly allowlist the few packages whose
# postinstall is load-bearing for this Electron app:
#   - electron: downloads the platform-specific Electron binary
#   - electron-winstaller: builds the Windows installer toolchain
#   - esbuild: installs the platform-specific native binary
# Add to this list intentionally, after auditing the package's install script.
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
